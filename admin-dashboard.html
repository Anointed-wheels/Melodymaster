<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | MelodyMaster</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    body {
      background-color: #F3F4F6;
      color: #1F2937;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
    }

    .admin-header {
      background: #FFFFFF;
      border-bottom: 1px solid #E5E7EB;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .admin-logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: #1F2937;
      text-decoration: none;
    }
    .admin-logo span { color: #4F46E5; }

    /* Container explicitly set to block stack (no side-by-side flex issues) */
    .admin-container {
      max-width: 1100px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      display: block;
    }

    .admin-title-box {
      margin-bottom: 1.5rem;
    }

    .admin-title-box h1 {
      font-size: 1.85rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      color: #111827;
    }

    .admin-title-box p {
      color: #6B7280;
      margin: 0;
      font-size: 1rem;
    }

    /* Table Card */
    .table-card {
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid #E5E7EB;
      overflow: hidden;
    }

    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .admin-table th, .admin-table td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #E5E7EB;
      font-size: 0.95rem;
    }

    .admin-table th {
      background: #F9FAFB;
      font-weight: 600;
      color: #374151;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    /* Status Badges */
    .status-badge {
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.025em;
      display: inline-block;
      text-transform: uppercase;
    }
    .badge-pending { background: #FEF3C7; color: #B45309; }
    .badge-approved { background: #D1FAE5; color: #047857; }
    .badge-paid { background: #DBEAFE; color: #1D4ED8; }
    .badge-unpaid { background: #FEE2E2; color: #B91C1C; }

    /* Action Buttons */
    .action-btn {
      padding: 0.5rem 0.85rem;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      font-weight: 600;
      transition: background 0.2s ease;
      margin-right: 5px;
    }
    .btn-approve { background: #10B981; color: white; }
    .btn-approve:hover { background: #059669; }
    
    .btn-payment { background: #3B82F6; color: white; }
    .btn-payment:hover { background: #2563EB; }
  </style>
</head>
<body>

  <!-- NAVIGATION HEADER -->
  <header class="admin-header">
    <a href="index.html" class="admin-logo">Melody<span>Master</span> Admin</a>
    <button id="logout-btn" class="music-btn music-btn--secondary" style="padding: 0.5rem 1rem; font-size: 0.85rem;">Log Out</button>
  </header>

  <!-- ADMIN MAIN CONTAINER -->
  <main class="admin-container">
    <div class="admin-title-box">
      <h1>Instructor Management</h1>
      <p>Review applicant statuses, approve instructors, and confirm space fee payments.</p>
    </div>

    <!-- INSTRUCTORS TABLE CARD -->
    <div class="table-card">
      <div class="table-responsive">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Instructor Details</th>
              <th>Instrument</th>
              <th>Approval Status</th>
              <th>Space Fee Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="teachers-table-body">
            <tr>
              <td colspan="5" style="text-align: center; color: #6B7280; padding: 3rem;">Loading instructors...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- JS SCRIPTS -->
  <script src="js/global.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
