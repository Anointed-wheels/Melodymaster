<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | MelodyMaster</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- NAVIGATION HEADER -->
  <header id="global-nav-header">
    <nav class="nav-container">
      <a href="index.html" class="nav-logo-link">Melody<span>Master</span></a>
      <ul class="nav-menu-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="instructors.html">Browse Teachers</a></li>
        <li><a href="about.html">How It Works</a></li>
      </ul>
      <div class="nav-auth-actions">
        <a href="login.html" id="nav-login-btn" class="music-btn music-btn--primary">Log In</a>
      </div>
      <button id="nav-mobile-toggle-btn" class="nav-mobile-toggle" aria-label="Open Navigation">☰</button>
    </nav>
  </header>

  <!-- AUTH MAIN CONTAINER -->
  <main id="auth-main-wrapper" class="animate-fade-in">
    <div class="auth-card-container">
      
      <div class="auth-card-header">
        <h1>Welcome Back</h1>
        <p>Log in to access your live lessons and schedule</p>
      </div>

      <form id="auth-login-form" class="auth-form">
        <div class="form-group">
          <label for="login-email-input">Email Address</label>
          <input type="email" id="login-email-input" class="form-input" placeholder="student@example.com" required>
        </div>

        <div class="form-group">
          <div class="auth-row-between">
            <label for="login-password-input">Password</label>
            <a href="forgot-password.html" class="auth-link">Forgot?</a>
          </div>
          <input type="password" id="login-password-input" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="login-submit-btn" class="music-btn music-btn--primary" style="width: 100%; margin-top: 0.5rem;">Log In</button>
      </form>

      <div class="auth-card-footer">
        Don't have an account? <a href="signup.html" class="auth-link">Create Account</a>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer id="global-footer">
    <div class="footer-container">
      <p>&copy; 2026 MelodyMaster. All rights reserved.</p>
    </div>
  </footer>

  <!-- JS SCRIPTS -->
  <script src="js/global.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
